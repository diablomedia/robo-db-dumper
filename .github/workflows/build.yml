name: Build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: PHP ${{ matrix.php-version }} / ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
        dependencies: [highest, lowest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        env:
          update: true
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring
          coverage: none
          tools: composer:2.11, cs2pr
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-
      - name: Validate Composer configuration
        run: composer validate --strict
      - name: Install dependencies
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          args=()
          if [[ "$DEPENDENCIES" == lowest ]]; then
            args+=(--prefer-lowest)
          fi
          composer update --no-interaction --no-progress --prefer-dist --prefer-stable --optimize-autoloader "${args[@]}"
      - name: PHPStan
        run: composer phpstan
      - name: Code style check
        run: composer style-check -- --format=checkstyle | cs2pr
